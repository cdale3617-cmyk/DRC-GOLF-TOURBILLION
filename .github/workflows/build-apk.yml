name: Build Tourbillion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack Tourbillion source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tourbillion-source
          mkdir -p tourbillion-source
          unzip -q DRC-Golf-Tourbillion-Base44-Source-2026-09-30.zip -d tourbillion-source
          echo "Source unpacked."

      - name: Find Tourbillion app
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_JSON=$(find tourbillion-source -type f -name package.json -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_JSON")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "App directory: $APP_DIR"

      - name: Install Base44 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Base44 app
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm run build

      - name: Install Capacitor
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Tourbillion Android app
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          WEB_DIR="dist"
          if [ ! -d "$WEB_DIR" ]; then
            if [ -d build ]; then
              WEB_DIR="build"
            else
              echo "ERROR: Cannot find dist or build web output."
              exit 1
            fi
          fi

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.drcgolf.tourbillion",
            "appName": "DRC Golf Tourbillion",
            "webDir": "$WEB_DIR"
          }
          EOF

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR/android"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Build Tourbillion APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect finished APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$APP_DIR/android" -type f -name "*debug*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          mkdir -p finished-apk
          cp "$APK" finished-apk/DRC-GOLF-TOURBILLION.apk
          ls -lh finished-apk/DRC-GOLF-TOURBILLION.apk

      - name: Upload Tourbillion APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-GOLF-TOURBILLION-APK
          path: finished-apk/DRC-GOLF-TOURBILLION.apk
          if-no-files-found: error
