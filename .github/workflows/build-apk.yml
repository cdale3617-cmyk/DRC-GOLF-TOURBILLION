name: Build Tourbillion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail

          corepack enable
          corepack prepare pnpm@12.8.1 --activate

          node --version
          pnpm --version

      - name: Unpack Tourbillion source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="LinedAggravatingDigit-source.zip"
          ROOT_DIR="tourbillion-source/LinedAggravatingDigit"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: $SOURCE_ZIP not found."
            exit 1
          fi

          rm -rf tourbillion-source
          mkdir -p tourbillion-source

          unzip -q "$SOURCE_ZIP" -d tourbillion-source

          if [ ! -f "$ROOT_DIR/package.json" ]; then
            echo "ERROR: Workspace root package.json not found."
            exit 1
          fi

          if [ ! -f "$ROOT_DIR/pnpm-workspace.yaml" ]; then
            echo "ERROR: pnpm-workspace.yaml not found."
            exit 1
          fi

          echo "ROOT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"

          echo "Workspace verified:"
          echo "$ROOT_DIR"

      - name: Verify Tourbillion mobile app
        shell: bash
        run: |
          set -euo pipefail

         
