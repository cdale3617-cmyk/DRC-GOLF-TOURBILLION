name: Build Tourbillion APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
          pnpm --version

      - name: Extract Tourbillion
        run: |
          set -e

          unzip -q LinedAggravatingDigit-source.zip -d source

          ROOT="source/LinedAggravatingDigit"
          APP="$ROOT/artifacts/drc-golf-mobile"

          test -f "$ROOT/package.json"
          test -f "$ROOT/pnpm-workspace.yaml"
          test -f "$APP/package.json"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Tourbillion mobile source found."

      - name: Install dependencies
        run: |
          set -e
          cd "$ROOT"

          pnpm config set dangerouslyAllowAllBuilds true --location project
          pnpm install --no-frozen-lockfile
          pnpm rebuild esbuild

      - name: Check Tourbillion
        run: |
          set -e
          cd "$ROOT"

          pnpm \
            --filter "./artifacts/drc-golf-mobile" \
            run typecheck

          echo "Tourbillion check passed."

      - name: Generate Android
        run: |
          set -e
          cd "$APP"

          rm -rf android

          pnpm exec expo prebuild \
            --platform android \
            --no-install

          test -f android/gradlew
          test -d android/app

          echo "Android project generated."

      - name: Build APK
        run: |
          set -e
          cd "$APP/android"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        run: |
          set -e

          APK="$APP/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p apk

          cp "$APK" apk/DRC-GOLF-TOURBILLION.apk

          echo "APK CREATED:"
          ls -lh apk/DRC-GOLF-TOURBILLION.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-GOLF-TOURBILLION-APK
          path: apk/DRC-GOLF-TOURBILLION.apk
          if-no-files-found: error
          retention-days: 30
