name: Build Tourbillion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail

          corepack enable
          corepack prepare pnpm@latest --activate

          echo "Node:"
          node --version

          echo "pnpm:"
          pnpm --version

      - name: Unpack CORRECT Tourbillion source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="LinedAggravatingDigit-source.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Correct Tourbillion source ZIP not found."
            exit 1
          fi

          rm -rf tourbillion-source
          mkdir -p tourbillion-source

          unzip -q "$SOURCE_ZIP" -d tourbillion-source

          echo "Tourbillion source unpacked."

      - name: Select CORRECT Tourbillion app
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="tourbillion-source/LinedAggravatingDigit"

          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: Tourbillion directory not found."
            exit 1
          fi

          if [ ! -f "$APP_DIR/package.json" ]; then
            echo "ERROR: Tourbillion package.json not found."
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "TOURBILLION DIRECTORY:"
          echo "$APP_DIR"

          echo ""
          ls -la "$APP_DIR"

      - name: Allow esbuild
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          node -e '
          const fs = require("fs");

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          pkg.pnpm = pkg.pnpm || {};

          const allowed = new Set(
            pkg.pnpm.onlyBuiltDependencies || []
          );

          allowed.add("esbuild");

          pkg.pnpm.onlyBuiltDependencies = Array.from(allowed);

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          '

          echo ""
          echo "esbuild approved for pnpm."

      - name: Install Tourbillion dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          pnpm install --no-frozen-lockfile

      - name: Rebuild esbuild
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          pnpm rebuild esbuild

          echo ""
          echo "esbuild rebuilt successfully."

      - name: Build Tourbillion web app
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          echo ""
          echo "Building DRC Golf Tourbillion..."

          pnpm run build

      - name: Install Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          pnpm add \
            @capacitor/core \
            @capacitor/android

          pnpm add -D \
            @capacitor/cli

      - name: Find Tourbillion web output
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          if [ -d dist ]; then
            WEB_DIR="dist"

          elif [ -d build ]; then
            WEB_DIR="build"

          elif [ -d out ]; then
            WEB_DIR="out"

          else
            echo "ERROR: Tourbillion web output not found."

            find . \
              -maxdepth 2 \
              -type d \
              -not -path "./node_modules*" \
              | sort

            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "WEB OUTPUT:"
          echo "$WEB_DIR"

      - name: Configure Tourbillion Android app
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.drcgolf.tourbillion",
            "appName": "DRC Golf Tourbillion",
            "webDir": "$WEB_DIR"
          }
          EOF

          echo ""
          cat capacitor.config.json

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

          pnpm exec cap sync android

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR/android"

          printf 'sdk.dir=%s\n' \
            "$ANDROID_SDK_ROOT" \
            > local.properties

          echo "Android SDK configured."

      - name: Build Tourbillion APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR/android"

          chmod +x gradlew

          echo ""
          echo "BUILDING TOURBILLION APK..."

          ./gradlew assembleDebug --stacktrace

      - name: Find finished Tourbillion APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$APP_DIR/android" \
            -type f \
            -name "*.apk" \
            -path "*/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."

            find "$APP_DIR/android" \
              -type f \
              -name "*.apk" \
              || true

            exit 1
          fi

          mkdir -p finished-apk

          cp "$APK" \
            finished-apk/DRC-GOLF-TOURBILLION.apk

          echo ""
          echo "======================================"
          echo "DRC GOLF TOURBILLION APK COMPLETE"
          echo "======================================"

          ls -lh \
            finished-apk/DRC-GOLF-TOURBILLION.apk

      - name: Upload Tourbillion APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-GOLF-TOURBILLION-APK
          path: finished-apk/DRC-GOLF-TOURBILLION.apk
          if-no-files-found: error
          retention-days: 30
