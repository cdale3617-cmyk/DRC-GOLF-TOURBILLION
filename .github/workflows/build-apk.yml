name: Build Tourbillion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Locate Base44 app
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(find . \
            -type f \
            -name package.json \
            -not -path "*/node_modules/*" \
            -print -quit)"

          if [ -z "${PACKAGE:-}" ]; then
            echo "ERROR: No package.json found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"

      - name: Install Base44 dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Base44 app
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm run build

          if [ -d dist ]; then
            echo "WEB_DIR=dist" >> "$GITHUB_ENV"
          elif [ -d build ]; then
            echo "WEB_DIR=build" >> "$GITHUB_ENV"
          else
            echo "ERROR: Build completed but no dist or build directory exists."
            ls -la
            exit 1
          fi

      - name: Install Capacitor
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          npm install \
            @capacitor/core@latest \
            @capacitor/android@latest

          npm install \
            --save-dev \
            @capacitor/cli@latest

      - name: Create Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.drcgolf.tourbillion",
            "appName": "DRC Golf Tourbillion",
            "webDir": "${WEB_DIR}",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          cat capacitor.config.json

      - name: Create Android app
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf android

          npx cap add android
          npx cap sync android

          test -f android/gradlew

          chmod +x android/gradlew

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              SDK="/usr/local/lib/android/sdk"
            else
              echo "ERROR: Android SDK not found."
              exit 1
            fi
          fi

          echo "ANDROID SDK: $SDK"

          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --licenses < /dev/null >/dev/null 2>&1 || true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew
