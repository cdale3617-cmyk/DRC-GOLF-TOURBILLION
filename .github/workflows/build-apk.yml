name: Build Tourbillion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack CORRECT Tourbillion source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="LinedAggravatingDigit-source.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Correct Tourbillion source ZIP not found."
            echo "$SOURCE_ZIP"
            exit 1
          fi

          rm -rf tourbillion-source
          mkdir -p tourbillion-source

          unzip -q "$SOURCE_ZIP" -d tourbillion-source

          echo "CORRECT Tourbillion source unpacked:"
          echo "$SOURCE_ZIP"

      - name: Select CORRECT Tourbillion app
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="tourbillion-source/LinedAggravatingDigit"

          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: Tourbillion root directory not found."
            exit 1
          fi

          if [ ! -f "$APP_DIR/package.json" ]; then
            echo "ERROR: Tourbillion root package.json not found."
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "CORRECT TOURBILLION DIRECTORY:"
          echo "$APP_DIR"

          echo ""
          echo "ROOT CONTENTS:"
          ls -la "$APP_DIR"

      - name: Show Tourbillion package
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          echo ""
          echo "PACKAGE.JSON:"
          cat package.json

      - name: Install Tourbillion dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Tourbillion web app
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          npm run build

      - name: Install Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      - name: Find Tourbillion web output
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          if [ -d dist ]; then
            WEB_DIR="dist"
          elif [ -d build ]; then
            WEB_DIR="build"
          elif [ -d out ]; then
            WEB_DIR="out"
          else
            echo "ERROR: Cannot find Tourbillion web build output."
            echo ""
            echo "Directory contents:"
            find . -maxdepth 2 -type d | sort
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "TOURBILLION WEB OUTPUT:"
          echo "$WEB_DIR"

      - name: Configure Tourbillion Android app
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.drcgolf.tourbillion",
            "appName": "DRC Golf Tourbillion",
            "webDir": "$WEB_DIR"
          }
          EOF

          echo ""
          echo "CAPACITOR CONFIG:"
          cat capacitor.config.json

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR/android"

          printf 'sdk.dir=%s\n' \
            "$ANDROID_SDK_ROOT" \
            > local.properties

      - name: Build Tourbillion APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$APP_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find finished Tourbillion APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$APP_DIR/android" \
            -type f \
            -name "*.apk" \
            -path "*/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Tourbillion APK was not produced."
            exit 1
          fi

          mkdir -p finished-apk

          cp "$APK" \
            finished-apk/DRC-GOLF-TOURBILLION.apk

          echo ""
          echo "FINISHED APK:"
          ls -lh \
            finished-apk/DRC-GOLF-TOURBILLION.apk

      - name: Upload Tourbillion APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-GOLF-TOURBILLION-APK
          path: finished-apk/DRC-GOLF-TOURBILLION.apk
          if-no-files-found: error
