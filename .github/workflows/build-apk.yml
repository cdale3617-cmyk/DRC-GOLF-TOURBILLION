name: Build Tourbillion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack Tourbillion source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tourbillion-source
          mkdir tourbillion-source
          unzip -q DRC-Golf-Tourbillion-Base44-Source-2026-09-30.zip -d tourbillion-source
          echo "Tourbillion source unpacked successfully"

      - name: Locate Tourbillion project
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(find tourbillion-source -type f -name package.json -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            find tourbillion-source -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at $PROJECT_DIR"

      - name: Install Tourbillion dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Tourbillion web app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run build

      - name: Install Capacitor
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -f capacitor.config.ts capacitor.config.json

          printf '%s\n' \
            '{' \
            '  "appId": "com.drcgolf.tourbillion",' \
            '  "appName": "DRC Golf Tourbillion",' \
            '  "webDir": "dist"' \
            '}' > capacitor.config.json

          cat capacitor.config.json

      - name: Check web build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -d dist ]; then
            echo "ERROR: dist folder not found"
            exit 1
          fi

          echo "Web build ready"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          echo "sdk.dir=$ANDROID_S
