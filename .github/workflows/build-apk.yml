name: Build Tourbillion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack Tourbillion source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: Tourbillion ZIP not found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf tourbillion-source
          mkdir -p tourbillion-source

          unzip -q "$ZIP_FILE" -d tourbillion-source

          echo "
